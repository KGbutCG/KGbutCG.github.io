<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на нашу свадьбу</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Мы женимся!</h1>
        <p>Иван & Мария</p>
        <div class="date">15 июня 2026, 18:00</div>
    </header>

    <section class="info">
        <h2>Где и когда</h2>
        <p>Ресторан "Счастье", Москва, ул. Ленина, 10</p>
        <iframe src="https://www.google.com/maps/embed?pb=...ва_карта" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </section>

    <section class="rsvp">
        <h2>Подтвердите присутствие (RSVP)</h2>
        <form id="rsvpForm">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="email" id="email" placeholder="Email" required>
            <select id="attendance" required>
                <option value="">Будете?</option>
                <option value="yes">Да, приду!</option>
                <option value="no">Нет, не смогу</option>
            </select>
            <textarea id="message" placeholder="Пожелания (опционально)"></textarea>
            <button type="submit">Отправить</button>
        </form>
        <p id="status"></p>
    </section>

    <footer>
        <p>С любовью, Иван и Мария | rsvp@yourdomain.ru</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
