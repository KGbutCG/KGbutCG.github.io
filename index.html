<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на нашу свадьбу</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Мы женимся!</h1>
        <p>Константин & Марина</p>
        <div class="date">13 июkя 2026, 16:00</div>
    </header>

    <section class="info">
        <h2>Где и когда?</h2>
        <p>Прелестный коттедж</p>
        <iframe src="<div style="position:relative;overflow:hidden;"><a href="https://yandex.ru/maps/213/moscow/?utm_medium=mapframe&utm_source=maps" style="color:#eee;font-size:12px;position:absolute;top:0px;">Москва</a><a href="https://yandex.ru/maps/213/moscow/?ll=37.402764%2C55.490324&mode=whatshere&utm_medium=mapframe&utm_source=maps&whatshere%5Bpoint%5D=37.402479%2C55.490235&whatshere%5Bzoom%5D=19.25&z=19.25" style="color:#eee;font-size:12px;position:absolute;top:14px;">Деревня Черепово, 18В — Яндекс Карты</a><iframe src="https://yandex.ru/map-widget/v1/?ll=37.402764%2C55.490324&mode=whatshere&whatshere%5Bpoint%5D=37.402479%2C55.490235&whatshere%5Bzoom%5D=19.25&z=19.25" width="560" height="400" frameborder="1" allowfullscreen="true" style="position:relative;"></iframe></div>" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </section>

    <section class="rsvp">
        <h2>Подтвердите присутствие (RSVP)</h2>
        <form id="rsvpForm">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="email" id="email" placeholder="Email" required>
            <select id="attendance" required>
                <option value="">Будете?</option>
                <option value="yes">Да, приду!</option>
                <option value="no">Нет, не смогу</option>
            </select>
            <textarea id="message" placeholder="Пожелания (опционально)"></textarea>
            <button type="submit">Отправить</button>
        </form>
        <p id="status"></p>
    </section>

    <footer>
        <p>С любовью, Марина и Константин | rsvp@yourdomain.ru</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
